# Names the shop-like filter catches that are NOT competing dsh plugin markets.
#
# `isShopLike` judges by NAME alone — the package name and, for github entries,
# the repo slug. It cannot tell a plugin that stores TEA from one that sells
# plugins, so it hides legitimate entries from the shelf and no one finds out:
# the entry is in the catalog, gated and tiered normally, and simply never
# rendered. Listing a name here clears that filter and nothing else. It grants
# no trust tier and skips no gate.
#
# Every row says what the plugin actually IS, because the name already lied
# once. `by` records who decided:
#
#   human — adjudicated in review.
#   llm   — judged by the daily classifier. Advisory, like every other LLM
#           verdict in this repo: correct a wrong one by editing the row.
#
# Seeded 2026-09-02 from an audit of all 73 names the filter caught in the
# live catalog. 53 were genuine competing plugin markets and stay excluded.

# --- Not a market in any sense. The keyword means something else entirely. ---

