# Human review results. A review is pinned to the exact version it covered:
# when npm's latest exceeds reviewedVersion the entry is downgraded to
# verified-stale, so passing review once cannot bless every future version.
# A repository entry (github channel) is pinned by reviewedCommit instead;
# any other commit downgrades it the same way.
#
# - name: dsh-hello-plugin          # npm entry: reviewedVersion
#   reviewedVersion: 1.2.0
#   reviewer: github:someone
#   reviewCommit: abc1234
#   notes: Reads only the workspace; no network.
# - name: dsh-repo-plugin           # github entry: reviewedCommit
#   reviewedCommit: <40-hex commit>
#   reviewer: github:someone
#   reviewCommit: abc1234
#   notes: Reads only the workspace; no network.
[]
