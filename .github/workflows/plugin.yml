name: plugin

on:
  push:
    # The two root READMEs are here because a release commit moves all four
    # install pins together, and readme-pins.test.ts is the guard for exactly
    # that. Without them, a commit fixing only a root README triggers neither
    # workflow: daily.yml filters on registry/** and the ROOT package.json.
    paths: &plugin-inputs
      - 'packages/dsh-plugin-shop/**'
      - 'packages/dsh-typert-protocol/**'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'README.zh.md'
      # This file, because its own action pins are part of what runs the
      # tests. Without it a workflow-only PR never runs this workflow: #8, #11
      # and #16 each moved a pin here and were covered only because their
      # diffs still carried packages/** files from a base that had not merged
      # yet — a property of the base, not of the change.
      - '.github/workflows/plugin.yml'
  pull_request:
    paths: *plugin-inputs
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The root suite — 733 tests, about ten seconds, measured 2026-09-04 — for
      # one test in it: readme-pins.test.ts guards the four install pins a
      # release commit must move together, and it had never run on a release
      # commit. plugin.yml ran only the package suite, and daily.yml's path
      # filter names the ROOT package.json, not the package's. 0.5.0 through
      # 0.5.2 shipped with a README three releases behind because of it.
      # Root vitest includes only registry/scripts/tests/**, so this step never
      # reaches the package e2e that the two steps below exist to set up.
      - run: pnpm test
      # Pinned to the harness the e2e's DOM contract is written against, NOT to
      # the workspace's own lockfile (which still resolves the harness dev deps
      # at 0.1.1-rc.2 — a separate, deliberate pin). This global install is what
      # serves the web UI the e2e drives, and the versions render mutually
      # exclusive contracts. Raw grep hits over
      # @deepseek-ai/dsh-client-ui-settings-plugin-inventory's lib/client.js,
      # inlined CSS included — so a count is not a count of JSX sites and only
      # the zero/non-zero split is load-bearing. Each row carries the date it
      # was taken, because an undated census cannot be aged out:
      #   0.1.1-rc.2  data-enabled x2, data-kind x0, no 全局插件 section
      #               (measured 2026-09-04)
      #   0.1.2-rc.1  data-enabled x0, data-kind x5, 插件列表 split in two with
      #               the Loader plane COLLAPSED when a preset roster exists
      #               (measured 2026-09-04)
      #   0.1.5-rc.1  data-kind x0 AND data-phase x0 — the enabled tag and the
      #               phase dot moved onto shared primitives that the web
      #               frontend BUNDLES rather than installing as a package, so
      #               a census of this package alone reads "the instrument was
      #               deleted" while the DOM still carries it. The <li> entry
      #               card's own four attributes — data-plugin-entry,
      #               data-plugin-module, data-failed, data-open — are unchanged
      #               from 0.1.2-rc.1. Its CHILDREN are not, and that is the
      #               half that cost two debugging rounds (measured 2026-09-10)
      # Names, not counts, are what a selector suite can satisfy one version of
      # at a time. The census is what makes this pin auditable; what the e2e
      # actually READS is not restated here, because it is no longer these
      # attributes at all — web-full-flow.e2e.ts's contract header owns that,
      # and repo-guards.test.ts fails the build if this pin and that header
      # name different harness versions.
      #
      # The other half of this arrangement is the workspace lockfile the first
      # line above says this pin is NOT. It resolves the harness dev deps at
      # 0.1.1-rc.2, and that is a FLOOR rather than a pin nobody got round to
      # moving. semver admits a prerelease only against a comparator carrying
      # its own [major.minor.patch], and every version the harness has published
      # on the 0.1 line is a prerelease, so `^0.1.1-rc.2` is satisfied by
      # 0.1.1-rc.2 and by nothing else — a range in spelling, a hard pin in
      # effect. The build therefore compiles against the OLDEST harness the
      # shipped peer range claims to support, which is what keeps it from
      # reaching for an API that only a newer one has.
      #
      # So these two are a pair, and neither is the claim by itself: compile at
      # the floor, run the e2e at the ceiling. At the ceiling only, nothing
      # stops the package from requiring a version it never declared. At the
      # floor only, a green typecheck says nothing about the harness users
      # actually install — which is precisely how 0.1.5-rc.1 removed two
      # attributes out from under this suite with `tsc --noEmit` green the whole
      # way. That is also why the reads that replaced them moved onto the a11y
      # contract instead of onto the next private attribute: a name the harness
      # needs for its own screen readers is one it cannot rename silently.
      #
      # Recorded for the next reader: the floor is COMPILED against but no
      # longer RUN against. This pin is the only harness the e2e ever sees, so
      # the lower end of the peer range is asserted by the build rather than
      # observed. That is a known gap, not an oversight — closing it means a
      # second e2e job on the floor, which is a decision, not a comment.
      - run: npm install -g @deepseek-ai/dsh@0.1.5-rc.1
      - run: dsh --version
      # The web full-flow e2e (P2 exit criterion) needs a playwright browser;
      # without --with-deps for now — the ubuntu-latest image already carries
      # chromium's system libraries, add it only if the runner proves otherwise.
      - run: pnpm -C packages/dsh-plugin-shop exec playwright install chromium
      - run: pnpm -C packages/dsh-plugin-shop test
        env:
          # These two files ARE the P1 and P2 exit criteria, and both skip when
          # they cannot find a working `dsh`. That is right on a developer's
          # machine and wrong here, where the two steps above exist precisely to
          # install the harness and the browser. Reproduced 2026-09-05: with
          # `dsh` hidden from PATH the suite reported `1 skipped` and exited 0,
          # so a green run was not evidence either criterion had executed.
          DSH_SHOP_REQUIRE_E2E: '1'
      - run: pnpm -C packages/dsh-plugin-shop typecheck
      - run: pnpm -C packages/dsh-plugin-shop build
