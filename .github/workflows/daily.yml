name: catalog

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    # A full harvest is thousands of live npm and GitHub requests. Without
    # this filter every commit ran one, docs included: on 2026-08-26 a burst
    # of README pushes fired seventeen harvests in a morning and npm
    # throttled the search endpoint, so the badge went red for reasons that
    # had nothing to do with the catalog. Only the inputs to the build
    # belong here.
    paths: &catalog-inputs
      - 'registry/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/daily.yml'
  pull_request:
    paths: *catalog-inputs
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A full healthy run -- install, tests, classify, harvest, stars, emit --
    # takes about 50 minutes, so this does not constrain one.
    #
    # What it is for: a per-request deadline bounds ONE request, and it is the
    # SUM that decides whether this job survives a stalled counterpart.
    #
    # The two advisory steps now cap their own sums, because both sit in front
    # of work that matters and neither is worth what it could cost: classify
    # runs BEFORE build:catalog and bounds each runBatches call at 15 minutes,
    # and the stars fetch runs before every artifact write and bounds itself at
    # 10. Neither cap is the constant, though: a budget check cannot interrupt
    # an in-flight request, so each overruns by one request deadline. Classify
    # is 15 + 10 = 25 per call and it makes two, so 50; stars is 10 + 0.5. The
    # optional data can therefore take ~60 of these 120 minutes, not ~40,
    # leaving ~60 for the harvest.
    #
    # The harvest is what this bound is really for, and it is honest about what
    # it buys. Measured: one stalled repository costs four bounded attempts
    # plus backoff, 134s -- except on the release-rescue path, where the asset
    # download's own 300s deadline puts it near 7.5 minutes (it is one attempt,
    # not four: see TARBALL_REQUEST_TIMEOUT_MS). At REPO_CONCURRENCY = 4
    # against a 2000 budget a total GitHub stall drains only ~212 repositories
    # inside 120 minutes --
    # and MAX_THROWN_FRACTION, which would otherwise stop the build loudly, is
    # evaluated only once the queue has drained, so it is unreachable in that
    # state. Under a pool-wide stall the run still dies here with no report, no
    # state commit and no catalog. This caps the wasted runner time at two
    # hours instead of six; it does not turn that outcome into a reported one.
    # An in-harvest budget, of the kind classify and stars now carry, is what
    # that would take, and none exists yet.
    timeout-minutes: 120
    permissions:
      # read, not write. This job installs dependencies, calls a plaintext LLM
      # gateway and fetches thousands of third-party manifests; the ambient
      # grant is what every one of those steps runs under. The two steps that
      # push carry their own credential in their own `env:` instead.
      contents: read
    # No job-level `env:`. Anything declared there is in EVERY step's
    # environment, and this block held NPM_TOKEN, LLM_API_KEY and GITHUB_TOKEN
    # — so all three sat in `pnpm install`'s environment, readable by a
    # postinstall hook in any transitive dependency, and LLM_API_KEY sat in the
    # environment of the step that fetches thousands of third-party manifests.
    # Exactly two steps consume any of them, and each now declares its own.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Otherwise checkout writes an http.extraheader credential into
          # .git/config, where EVERY later step can read it and push with it —
          # a postinstall hook in any transitive dependency included. Scoping a
          # token to the push steps' env: is pointless while that file holds
          # one. `git fetch origin main` in those steps still works
          # unauthenticated: the repository is public.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Classify new listings
        run: node --experimental-strip-types registry/scripts/src/classify.ts
        env:
          # Optional read-only npm token; lifts the search API's per-IP rate
          # limit onto the token. Empty (e.g. on fork PRs) = unauthenticated.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The LLM classifier's gateway. The key is a secret; an empty value
          # (fork PRs) skips classification — this step is designed for it.
          # The gateway serves plain HTTP only (no TLS listener) — the Bearer
          # key rides plaintext on the runner→gateway path; rotate-able key,
          # gateway owner's transport choice. Switch to https when the mirror
          # gains TLS.
          LLM_BASE_URL: http://8.141.31.123:3000/v1
          LLM_MODEL: deepseek-v4-flash
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - run: pnpm build:catalog -- --harvest-from dist/harvest.json
        env:
          # Flipped in the 0.4.10 release: the client that reads schemaVersion 3
          # (repo entries) ships, so the catalog may publish them.
          SHOP_HARVEST_REPOS: '1'
          # Subpackage probing rides the v4 client: the flag flips in the
          # release commit that ships it, so no v3 client ever meets a
          # subdir entry (schemaVersion 4).
          SHOP_HARVEST_SUBPACKAGES: '1'
          # The v5 catalog (added/tarball/theme/replacement) rides the v5
          # client: the flag flips in the release commit that ships it, so no
          # older client ever meets a theme category or v5 entry shape.
          SHOP_CATALOG_V5: '1'
          # A dedicated read-only PAT lifts the stars GraphQL quota past the
          # catalog's repo count; without it the GITHUB_TOKEN's ~1k points
          # cover only a third of the shelf per run.
          STARS_TOKEN: ${{ secrets.STARS_TOKEN }}
          # Read by build.ts: the npm search rate limit, and the GitHub half of
          # the harvest plus its stars fallback. Declared here rather than
          # job-wide because this is the step that reads them.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-report
          path: |
            dist/v1/report.md
            dist/v1/classification-report.md
      - name: Upload catalog dist for the publish job
        # dist/ is git-ignored and does not survive between jobs. The publish
        # job needs the exact bytes this run built, never a rebuild — a
        # rebuild would spend another full harvest and could legitimately
        # disagree with what Pages just got below, publishing mismatched
        # content between the two transports.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Never fatal to this job. Steps run in sequence and any failure ends
        # the job, so a bad minute from the artifact service would otherwise
        # skip `Publish to Pages` below AND `Commit the snapshot`, costing this
        # run its catalog and resetting the harvest's backfill memory — for a
        # step that only feeds the publish job. It still fails loudly where it
        # matters: the publish job's download step has nothing to fetch and
        # stops there. Same reasoning as the two `Commit the ...` steps.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-dist-v1
          path: dist/v1
      - name: Publish to Pages
        # `workflow_dispatch` fires on ANY ref, so the event check alone would
        # let a feature branch's catalog reach every reader. The github-pages
        # environment already restricts deployment to `main`, but that lives in
        # repository settings where one admin click widens it; the branch this
        # publishes from belongs in the workflow. 0.5.0 is what a wrong catalog
        # reaching everyone costs.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/pages
      - name: Commit the classifier's output
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
        continue-on-error: true
        # markets.yml as well as categories.yml. The classify step writes both,
        # and a market verdict that is not committed is not a memory: the name
        # would be re-asked every run, which is the flip-flop the file exists to
        # prevent — and one bad roll would then be recorded forever.
        #
        # The push fetches and rebases first, with one retry. Without it both
        # pushes were rejected `(fetch first)` on 2026-09-02 and 2026-09-03
        # while the run reported success, discarding each day's verdicts. The
        # step stays continue-on-error: a rejected push must not skip `Commit
        # the snapshot` below it, and must not fail the job that `publish` and
        # `deploy` both declare `needs: build` on. The rejection is surfaced as
        # ::error:: instead.
        #
        # The `github.ref` guard belongs to that push rather than being
        # boilerplate: `workflow_dispatch` fires on ANY ref, and while this
        # step ended in a bare `git push` a dispatch from a feature branch was
        # harmless — it went to that branch's own upstream. `HEAD:main` would
        # replay the dispatched branch onto main and push it. The parentheses
        # are load-bearing: `&&` binds tighter than `||`, so without them the
        # guard would cover only the `push` disjunct.
        #
        # WHY IT SITS HERE and not beside the classify step that produced it:
        # push_with_rebase mutates the working tree. Between `pnpm test` and
        # `pnpm build:catalog`, where this step used to run, it pulled whatever
        # a human landed on main during the ~50-minute run into the tree AFTER
        # the tests had validated the checked-out SHA and BEFORE the harvest
        # read `registry/`, with node_modules resolved from a possibly
        # superseded lockfile. workflow.test.ts now fails on any tree-mutating
        # git command before build:catalog.
        #
        # The trade-off, stated rather than deferred: committing down here
        # means a failing `build:catalog` loses the day's LLM verdicts, and
        # committing up there would have kept them. This is the cheaper side.
        # Per CLAUDE.md the classifier is advisory — a failed classification
        # leaves the entry unclassified and is retried on the next build — so
        # a lost day costs one more classification run, while a rebase in front
        # of the harvest costs a catalog built from inputs nothing validated,
        # published to npm `latest` and to Pages unattended. (The early
        # position preserved nothing on its own either: the runner is
        # discarded, so only the PUSH preserves a verdict, and the push is the
        # half that cannot move.)
        #
        # `--autostash` is what lets the rebase run from here at all: the
        # snapshot step's three files are already written and still uncommitted
        # underneath it. Its one measured edge is now checked rather than
        # documented — if the autostash cannot be reapplied (a human commit on
        # main touching one of those three bot-written files inside the same
        # window) git leaves conflict markers in the tree, keeps the stash, and
        # STILL reports the rebase successful. push_with_rebase looks for that
        # and fails this step there; while it did not, the snapshot step below
        # committed the markers and the throw arrived a build later, on a
        # malformed registry file, with nothing naming the run that wrote it.
        env:
          # The only write credential in this job, and it lives here rather
          # than job-wide: a fine-grained PAT scoped to this repository with
          # Contents: read and write and nothing else, read by the credential
          # helper inside the push below. An empty value (a fork, a local run,
          # an expired token) makes the push fail, which continue-on-error
          # turns into the ::error:: this step already emits for a rejected
          # push — the catalog still publishes.
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          git config user.name 'dsh-plugin-shop bot'
          git config user.email 'bot@users.noreply.github.com'
          push_with_rebase() {
            for attempt in 1 2; do
              git fetch origin main || true
              # --autostash: both commit steps now run after the harvest, so
              # each meets the OTHER's freshly written, uncommitted files.
              # A plain rebase refuses that outright ("cannot rebase: You have
              # unstaged changes"), the abort then answers "No rebase in
              # progress?", and the un-rebased push is rejected — the very
              # `(fetch first)` failure this function exists to end.
              git rebase --autostash origin/main || { git rebase --abort || true; }
              # A rebase that reports success says nothing about the REAPPLY.
              # Measured on git 2.34.1: when the rebase itself is clean and
              # only the autostash conflicts, git exits 0 with "Successfully
              # rebased and updated refs/heads/main", writes conflict markers
              # into the working tree and KEEPS the stash. This step's own
              # commit is clean, so the push below would go through; the OTHER
              # commit step then `git add`s the marked file and pushes THAT,
              # and the corruption surfaces a build later as a
              # malformed-registry throw with nothing naming the run that
              # wrote it.
              #
              # Both signals, and deliberately redundant rather than two
              # distinct cases: on git 2.34.1 they fired together in both
              # failure shapes measured — a conflicting reapply, and a reapply
              # onto a file the upstream commit had deleted (`DU`) — so
              # neither is load-bearing alone today. The kept stash is what
              # git leaves behind; an unmerged index entry is the corruption
              # itself; either still fires if a later git stops producing the
              # other. Not a grep for the markers: it would read every tracked
              # file and cannot tell corruption from a line that legitimately
              # starts `<<<<<<<`. Neither fires on a healthy run (a clean
              # reapply drops the stash) nor after `git rebase --abort` (which
              # restores the autostash to the tree it was taken from) — both
              # measured, and both pinned by workflow.test.ts, which also pins
              # that no retry is spent here: a second fetch-and-rebase cannot
              # reapply a stash that already conflicts.
              if [ -n "$(git stash list)" ] || [ -n "$(git ls-files --unmerged)" ]; then
                echo "::error::the rebase reported success but its autostash did not reapply; $1 was not pushed and the tree holds conflict markers with the stash still unapplied. Someone landed on main inside this run's window; nothing on main needs undoing, so re-run the workflow."
                return 1
              fi
              # The credential reaches git through the ENVIRONMENT and nothing
              # else: not .git/config (checkout no longer writes one) and not a
              # command line. GIT_CONFIG_COUNT/KEY/VALUE is the env spelling of
              # `-c`, used instead of `-c` for two reasons — the helper script
              # stays out of argv, and `git push` stays adjacent so
              # workflow.test.ts's push-step detector keeps working. KEY_0 is an
              # EMPTY credential.helper, which resets any inherited helper list
              # so KEY_1 is the only one consulted; that helper prints the
              # token, which the shell git spawns for it expands from this
              # step's env.
              if GIT_CONFIG_COUNT=2 \
                 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0= \
                 GIT_CONFIG_KEY_1=credential.helper \
                 GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=$REGISTRY_PUSH_TOKEN"; }; f' \
                 git push origin HEAD:main; then return 0; fi
              echo "::warning::push attempt $attempt was rejected; refetching"
            done
            echo "::error::could not push $1 after two attempts; this run's changes were not recorded"
            return 1
          }
          git add registry/categories.yml registry/markets.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(registry): llm classifier update"
          push_with_rebase "the classifier's output"
      - name: Commit the snapshot
        # push included: the repo-state.json backfill memory must persist
        # across push-triggered runs, or every run restarts from empty.
        #
        # first-seen.yml is staged too. It is written every build and was never
        # added, so every name absent from the committed file was re-stamped
        # `added: <today>` the next day: 4,842 of 9,422 live entries carried
        # `added: "2026-09-03"`, 3,197 entries differed from the previous build
        # in `added` alone, the "stable" content hash churned daily, and
        # publish-catalog's unchanged-skip path could never fire. Adding a new
        # registry write without adding it here now fails workflow.test.ts.
        #
        # The push fetches and rebases first, with one retry — the same
        # function as the classifier commit above, and the same `(fetch first)`
        # rejections on 2026-09-02 and 2026-09-03. continue-on-error stays for
        # half the reason it does there: this is the last step in `build`, so
        # nothing later in this job is at stake — but `publish` and `deploy`
        # both declare `needs: build` and would be skipped wholesale if a
        # rejected push failed the job, costing the run its npm publish and its
        # Pages deploy over a commit that can simply be made again tomorrow.
        # The ::error:: annotation is what keeps that visible.
        #
        # This step runs after the classifier commit, not before it, and the
        # order is load-bearing in one direction: whichever of the two runs
        # first meets the other's uncommitted files, which is why both copies
        # of push_with_rebase carry --autostash. Swapping them would work
        # equally well; putting either back in front of `build:catalog` would
        # not, and workflow.test.ts fails on that.
        #
        # The `github.ref` guard is the one described on the classifier commit
        # above, for the same reason and with the same load-bearing parentheses.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          # The only write credential in this job, and it lives here rather
          # than job-wide: a fine-grained PAT scoped to this repository with
          # Contents: read and write and nothing else, read by the credential
          # helper inside the push below. An empty value (a fork, a local run,
          # an expired token) makes the push fail, which continue-on-error
          # turns into the ::error:: this step already emits for a rejected
          # push — the catalog still publishes.
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          git config user.name 'dsh-plugin-shop bot'
          git config user.email 'bot@users.noreply.github.com'
          push_with_rebase() {
            for attempt in 1 2; do
              git fetch origin main || true
              # --autostash: both commit steps now run after the harvest, so
              # each meets the OTHER's freshly written, uncommitted files.
              # A plain rebase refuses that outright ("cannot rebase: You have
              # unstaged changes"), the abort then answers "No rebase in
              # progress?", and the un-rebased push is rejected — the very
              # `(fetch first)` failure this function exists to end.
              git rebase --autostash origin/main || { git rebase --abort || true; }
              # A rebase that reports success says nothing about the REAPPLY.
              # Measured on git 2.34.1: when the rebase itself is clean and
              # only the autostash conflicts, git exits 0 with "Successfully
              # rebased and updated refs/heads/main", writes conflict markers
              # into the working tree and KEEPS the stash. This step's own
              # commit is clean, so the push below would go through; the OTHER
              # commit step then `git add`s the marked file and pushes THAT,
              # and the corruption surfaces a build later as a
              # malformed-registry throw with nothing naming the run that
              # wrote it.
              #
              # Both signals, and deliberately redundant rather than two
              # distinct cases: on git 2.34.1 they fired together in both
              # failure shapes measured — a conflicting reapply, and a reapply
              # onto a file the upstream commit had deleted (`DU`) — so
              # neither is load-bearing alone today. The kept stash is what
              # git leaves behind; an unmerged index entry is the corruption
              # itself; either still fires if a later git stops producing the
              # other. Not a grep for the markers: it would read every tracked
              # file and cannot tell corruption from a line that legitimately
              # starts `<<<<<<<`. Neither fires on a healthy run (a clean
              # reapply drops the stash) nor after `git rebase --abort` (which
              # restores the autostash to the tree it was taken from) — both
              # measured, and both pinned by workflow.test.ts, which also pins
              # that no retry is spent here: a second fetch-and-rebase cannot
              # reapply a stash that already conflicts.
              if [ -n "$(git stash list)" ] || [ -n "$(git ls-files --unmerged)" ]; then
                echo "::error::the rebase reported success but its autostash did not reapply; $1 was not pushed and the tree holds conflict markers with the stash still unapplied. Someone landed on main inside this run's window; nothing on main needs undoing, so re-run the workflow."
                return 1
              fi
              # The credential reaches git through the ENVIRONMENT and nothing
              # else: not .git/config (checkout no longer writes one) and not a
              # command line. GIT_CONFIG_COUNT/KEY/VALUE is the env spelling of
              # `-c`, used instead of `-c` for two reasons — the helper script
              # stays out of argv, and `git push` stays adjacent so
              # workflow.test.ts's push-step detector keeps working. KEY_0 is an
              # EMPTY credential.helper, which resets any inherited helper list
              # so KEY_1 is the only one consulted; that helper prints the
              # token, which the shell git spawns for it expands from this
              # step's env.
              if GIT_CONFIG_COUNT=2 \
                 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0= \
                 GIT_CONFIG_KEY_1=credential.helper \
                 GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=$REGISTRY_PUSH_TOKEN"; }; f' \
                 git push origin HEAD:main; then return 0; fi
              echo "::warning::push attempt $attempt was rejected; refetching"
            done
            echo "::error::could not push $1 after two attempts; this run's changes were not recorded"
            return 1
          }
          git add registry/snapshots/manifest.lock registry/repo-state.json registry/first-seen.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(registry): daily catalog snapshot"
          push_with_rebase "the daily snapshot"

  publish:
    needs: build
    # Runs on the schedule now: the first manual dispatch proved the granular
    # token publishes without an OTP prompt (design §7.2). The branch guard
    # matters because workflow_dispatch can be fired from any ref: without
    # it, a dispatch from a feature branch would publish that branch's
    # catalog to `latest` on npm — a name claim and a version burn a rerun
    # cannot take back.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance attestation on the catalog publish is minted from
      # GitHub's OIDC endpoint. Confined to this job rather than `build`, so
      # the full harvest and the LLM classification step never run with an
      # OIDC token in scope.
      id-token: write
    # Bounded because the mirror-warm poll at the end of publish:catalog has
    # no timeout of its own (Task 7 review, Minor): it makes up to 21
    # requests to npmmirror, and a connection that is accepted but never
    # answered falls back on undici's 300 s defaults. Checkout, install, and
    # a publish plus successful warm take well under a minute combined, so
    # ten is generous and still fails fast instead of burning runner time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download catalog dist from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog-dist-v1
          path: dist/v1
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Publish the catalog to npm
        run: pnpm publish:catalog
        env:
          # Distinct from NPM_TOKEN, which is read-only and only lifts the
          # search API's rate limit.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  deploy:
    needs: build
    # Same reasoning as the upload step above: the github-pages environment
    # restricts this to `main` today, and this makes the workflow say so too.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://LivXue.github.io/dsh-plugin-shop
    # `build` and `publish` carried bounds and this job did not, so a stuck
    # deploy ran to the six-hour platform default. Its one step is
    # `actions/deploy-pages@v4`, which requests the deployment and then POLLS
    # the Pages API until it goes live; that poll has its own `timeout` input,
    # 600000 ms by default. Fifteen sits just above it so the action's own
    # message is what a stalled deployment reports, while anything that hangs
    # before reaching that path still dies in minutes rather than hours.
    timeout-minutes: 15
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
