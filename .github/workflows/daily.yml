name: catalog

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional read-only npm token; lifts the search API's per-IP rate
      # limit onto the token. Empty (e.g. on fork PRs) = unauthenticated.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:catalog
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-report
          path: dist/v1/report.md
      - name: Publish to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit the snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git config user.name 'dsh-plugin-shop bot'
          git config user.email 'bot@users.noreply.github.com'
          git add registry/snapshots/manifest.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(registry): daily catalog snapshot"
          git push

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://LivXue.github.io/dsh-plugin-shop
    steps:
      - uses: actions/deploy-pages@v4
